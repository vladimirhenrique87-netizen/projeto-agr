<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Projeto AGR</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-10">

    <div class="max-w-xl mx-auto bg-gray-800 p-6 rounded-lg border border-gray-700">
        <h1 class="text-2xl font-bold text-green-500 mb-6">🌾 Projeto AGR - Cadastro</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Nome do Lote</label>
                <input id="nome" type="text" placeholder="Ex: Talhão Alfa" class="w-full p-3 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none">
            </div>
            <div>

                <input id="cultura" type="text" placeholder="Ex: Café" class="w-full p-3 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Tamanho (Hectares)</label>
                <input id="tamanho" type="number" step="0.1" placeholder="Ex: 5.5" class="w-full p-3 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none">
            </div>
            <button onclick="salvar()" class="bg-green-600 p-3 w-full font-bold hover:bg-green-500 rounded transition-colors">CADASTRAR</button>
        </div>

        <div class="mt-8">
            <h2 class="text-lg font-semibold mb-3 text-gray-300">Lotes no Banco:</h2>
            <div id="lista" class="space-y-2 text-gray-400">Buscando dados...</div>
        </div>
    </div>

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const nomeInput = document.getElementById('nome').value;
            const culturaInput = document.getElementById('cultura').value;
            const tamanhoInput = document.getElementById('tamanho').value;
            
            if(!nomeInput || !culturaInput || !tamanhoInput) {
                return alert('Preencha todos os campos!');
            }
            
            const { error } = await supabaseClient.from('Table de lotes agrícolas').insert([{ 
                nome: nomeInput,
                culture: culturaInput,
                tamanho: parseFloat(tamanhoInput)
            }]);

            if (error) {
                alert('Erro ao salvar no banco!');
                console.error(error);
            } else {
                document.getElementById('nome').value = '';
                document.getElementById('cultura').value = '';
                document.getElementById('tamanho').value = '';
                carregar();
            }
        }
